services:
  support-query-tool:
    build: .
    container_name: support-query-tool
    restart: unless-stopped
    labels:
      # Watchtower soll dieses Support-Tool vorerst nicht automatisch aktualisieren.
      com.centurylinklabs.watchtower.enable: "false"
    environment:
      PORT: "${PORT:-8080}"
      SUPPORT_PASSWORD: "${SUPPORT_PASSWORD:?SUPPORT_PASSWORD muss in .env gesetzt werden}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      FOOTER_NOTICE: "${FOOTER_NOTICE:-Entwickelt von Daniel Soro (Kundensupport bei 4NetPlayers) mit Unterstützung von KI zur Erleichterung seiner Supportarbeit. Privat unter lynxnode.it betrieben; kein offizielles Angebot von 4NetPlayers.}"
      SCUM_MASTER_SERVERS: "${SCUM_MASTER_SERVERS:-176.57.138.2:1040,83.223.199.20:1040,83.223.200.20:1040}"
      SCUMMETRICS_API_BASE_URL: "${SCUMMETRICS_API_BASE_URL:-https://scummetrics.com/api/v1/servers}"
    ports:
      - "${PORT:-8080}:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - "const response = await fetch('http://127.0.0.1:8080/api/health'); if (!response.ok) Deno.exit(1);"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - npm-network

networks:
  npm-network:
    external: true
    name: npm-network