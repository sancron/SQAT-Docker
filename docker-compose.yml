services:
  support-query-tool:
    build: .
    container_name: support-query-tool
    restart: unless-stopped
    environment:
      PORT: "${PORT:-8080}"
      SUPPORT_PASSWORD: "${SUPPORT_PASSWORD:?SUPPORT_PASSWORD muss in .env gesetzt werden}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    ports:
      - "${PORT:-8080}:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - npm-network

networks:
  npm-network:
    external: true
    name: npm-network

